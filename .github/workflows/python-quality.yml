name: Python quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: pytest, Black, Ruff (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install locked dependencies and editable project
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-build-isolation -c requirements/ci.txt -e '.[test]'
          python -m pip check
          python -m pip freeze
      - name: pytest (offline suite)
        run: python -m pytest --junitxml=test-results/pytest.xml
      - name: Black (read-only)
        if: ${{ !cancelled() }}
        run: python -m black --check src tests scripts app.py
      - name: Ruff (read-only)
        if: ${{ !cancelled() }}
        run: python -m ruff check src tests scripts app.py
      - name: Upload pytest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
