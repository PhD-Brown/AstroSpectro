name: Python quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: pytest, Black, Ruff (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install locked dependencies and editable project
        run: |
          python -m pip install -r requirements/ci.txt
          python -m pip install --no-build-isolation -c requirements/ci.txt -e '.[test]'
          python -m pip check
          python -m pip freeze
      - name: pytest (offline suite)
        run: python -m pytest --junitxml=test-results/pytest.xml
      - name: Black (read-only)
        if: ${{ !cancelled() }}
        run: python -m black --check src tests scripts app.py
      - name: Ruff (read-only)
        if: ${{ !cancelled() }}
        run: python -m ruff check src tests scripts app.py
      - name: Upload pytest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14
