# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrospectro"
version = "0.1.0"
description = "A modular pipeline for stellar spectral classification."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT License" }
authors = [
  { name = "Alex Baker", email = "alex.baker.1@ulaval.ca" },
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "astropy",
    "specutils",
    "scikit-learn",
    "joblib",
    "xgboost",
    "lightgbm",
    "matplotlib",
    "seaborn",
    "ipywidgets",
    "requests",
    "beautifulsoup4",
    "tqdm",
    "pywavelets",
    "jupyterlab",
    "notebook",
    "ipykernel",
    "plotly",
    "streamlit",
    "imbalanced-learn",
    "shap",
    "astroquery",
    "ruff",
    "black",
    "catboost",
    "python-dotenv",
    "Pillow",
    "python-dateutil"
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-socket==0.7.0", "PyYAML==6.0.3"]

[project.urls]
Homepage = "https://github.com/PhD-Brown/AstroSpectro"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utils"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-config --strict-markers --disable-socket -m "not slow and not network"'
markers = [
    "unit: isolated tests of a single component",
    "integration: tests of interfaces between components using synthetic data",
    "slow: expensive tests excluded from the default suite",
    "network: tests requiring external services, excluded from the default suite",
]
